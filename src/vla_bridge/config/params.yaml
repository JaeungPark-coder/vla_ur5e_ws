vla_policy_client:
  ros__parameters:
    # Also declared as a launch argument (vla_bridge.launch.py) with the
    # same default, for `ros2 launch ... robot_ip:=<ip>`. Editing this value
    # only takes effect if you never pass robot_ip:= on the launch command
    # line -- the launch argument's default always overrides this file once
    # substituted in, same trade-off as robot_backend below. Pick one way to
    # set it and stay with it.
    robot_ip: "192.168.1.100"
    # 'rtde' = real UR5e over RTDE. 'isaac_sim' = talk to
    # ../../isaac/pick_place_scene_bridge.py over ROS2 topics instead --
    # run that script separately first (with Isaac Sim's own python.sh),
    # then launch this with robot_backend:=isaac_sim.
    robot_backend: "isaac_sim"
    policy_host: "localhost"
    policy_port: 8000
    prompt: "pick up the cube and place it in the target zone"
    # 2026-09-23: was 10.0. A ros2 launch of this file loads THIS file's
    # values over vla_policy_client.py's own declare_parameter defaults --
    # so fixing the Python default without this file was a no-op for
    # anyone actually launching via vla_bridge.launch.py. See vla_policy_
    # client.py's own control_hz comment for the full 60Hz-vs-10Hz
    # reasoning; keep the two in sync, nothing enforces it automatically.
    control_hz: 60.0
    # Only used when robot_backend is 'rtde' -- REPLACE with your actual
    # camera driver's topic names.
    base_image_topic: "/camera/base/image_raw"
    wrist_image_topic: "/camera/wrist/image_raw"
    # 2026-09-23: was 'none' (see the same launch-overrides-Python-default
    # note on control_hz above -- this file is what actually reaches a
    # ros2 launch). Only used when robot_backend is 'rtde'. 'none' = the
    # placeholder relay in robot_interface.py, gripper state reported as
    # NOT MEASURED, which vla_policy_client.py's own runtime warning
    # already flags as a train/serve mismatch. 'robotiq_socket' (now the
    # default) = a real Robotiq over the UR controller's Socket ADI
    # interface -- see robotiq_socket_gripper.py. Pass gripper_driver:=none
    # explicitly for bring-up before the gripper is wired.
    gripper_driver: "robotiq_socket"
    gripper_socket_port: 63352
    # 2026-10-05: was 300 -- ~29% of a demonstration (~1044 actions at one per
    # 60 Hz sim tick), so every eval trial ended in FAILURE at max_steps. Counted
    # in actions applied, not inferences. Keep in sync with the Python default.
    max_steps: 1800
    # 2026-10-05: the dataset's gripper action is the MEASURED position (~0.7 while
    # holding, since the cube stalls the finger) but the demonstrator commanded
    # 1.0 -- sending ~0.7 back leaves ~0 squeeze force. With hysteresis on the
    # output becomes a close/open decision (close above 0.45, open below 0.25).
    # See vla_bridge/gripper_command.py. false = send the raw clipped value.
    gripper_hysteresis: true
    gripper_close_threshold: 0.45
    gripper_open_threshold: 0.25
    # Actions applied per inference. 1 = re-infer every action (original).
    execute_horizon: 1
    # isaac_sim backend only: true = exactly one sim tick per action. Start the
    # bridge with `--lockstep` (or VLA_BRIDGE_LOCKSTEP=1) as well -- the two must
    # match. See isaac/lockstep_protocol.py.
    lockstep: false
    # Phase 4 (optional) -- see ../../isaac/train_residual_policy.py and
    # README.md. 'false' (default) = pi0's action applied as-is.
    use_residual_policy: false
    residual_model_path: ""
    residual_scale: 0.05
    # Offline evaluation -- isaac_sim backend only. Runs n_trials episodes
    # back-to-back and logs (trial, success, steps, xy_error_mm) rows to
    # results_csv_path, in the same shape hybrid_pick_place_demo.py and
    # openvla_pick_place_demo.py use, for a direct 3-way comparison.
    eval_mode: false
    n_trials: 20
    success_xy_tolerance_m: 0.03
    holding_gripper_threshold: 0.5
    # 2026-09-23: was 0.03 (see the launch-overrides-Python-default note
    # above). isaac/pick_place_scene.py's LIFT_Z_THRESHOLD (what collect_
    # demos.py gates a saved demonstration on) is 0.08 -- a 1-3cm lift was
    # being logged SUCCESS here while the same outcome would be rejected as
    # "never lifted" at collection time, defeating the 3-pipeline
    # comparison eval_mode's results_csv exists for. Keep in sync with
    # pick_place_scene.LIFT_Z_THRESHOLD; nothing enforces it automatically.
    lifted_z_threshold: 0.08
    eval_target_position: [0.45, 0.30, 0.0]  # must match isaac/pick_place_scene.py's PLACE_TARGET_POSITION
    results_csv_path: "vla_eval_results.csv"
